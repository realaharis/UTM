name: MaxRAM macOS runner diagnostic

on:
  push:
    branches:
      - feat/maxram-8c-4g-jit64
    paths:
      - .github/workflows/maxram-runner-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-runner-probe:
    name: Check access to ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-latest, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 5
    steps:
      - name: Record macOS runner and Xcode availability
        shell: bash
        run: |
          echo "Assigned GitHub runner: $RUNNER_NAME"
          echo "Host architecture: $(uname -m)"
          echo "macOS: $(sw_vers -productVersion)"
          xcodebuild -version
          for p in /Applications/Xcode_26.3.app /Applications/Xcode_26.2.app; do
            if [ -d "$p" ]; then echo "Available: $p"; fi
          done
          df -h .
