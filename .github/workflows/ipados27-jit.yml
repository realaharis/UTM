name: iPadOS 27 JIT IPA

on:
  workflow_dispatch:
  push:
    branches:
      - feat/ipados27-jit
    paths:
      - 'scripts/build_dependencies.sh'
      - 'patches/**'
      - 'JIT/**'
      - '.github/workflows/ipados27-jit.yml'

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 240

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode
        shell: bash
        run: |
          set -euo pipefail
          if [ -d /Applications/Xcode_26.0.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.0.app
          fi
          xcodebuild -version

      - name: Install build requirements
        shell: bash
        run: |
          set -euo pipefail
          brew install bison pkg-config gettext glib-utils libgpg-error nasm make meson cmake llvm spirv-tools spirv-llvm-translator libxcb libxrandr ldid dpkg
          python3 -m pip install --break-system-packages --user six pyparsing pyyaml setuptools distlib mako
          echo "/opt/homebrew/opt/bison/bin" >> "$GITHUB_PATH"
          echo "/usr/local/opt/bison/bin" >> "$GITHUB_PATH"

      - name: Install Mesa-compatible libclc payload
        shell: bash
        run: |
          set -euo pipefail
          VERSION="22.1.8.3"
          BASE="https://gitlab.freedesktop.org/api/v4/projects/27606/packages/generic/mesa-libclc/$VERSION"
          PREFIX="$RUNNER_TEMP/mesa-libclc"

          mkdir -p "$PREFIX/libclc" "$PREFIX/share/pkgconfig" "$PREFIX/include"

          curl -fL --retry 5 --retry-delay 3 "$BASE/spirv-mesa3d-.spv" -o "$PREFIX/libclc/spirv-mesa3d-.spv"
          curl -fL --retry 5 --retry-delay 3 "$BASE/spirv64-mesa3d-.spv" -o "$PREFIX/libclc/spirv64-mesa3d-.spv"

          test -s "$PREFIX/libclc/spirv-mesa3d-.spv"
          test -s "$PREFIX/libclc/spirv64-mesa3d-.spv"

          cat > "$PREFIX/share/pkgconfig/libclc.pc" <<EOF
          includedir=$PREFIX/include
          libexecdir=$PREFIX/libclc

          Name: libclc
          Description: Mesa-compatible OpenCL C library payload
          Version: $VERSION
          Cflags: -I\${includedir}
          Libs: -L\${libexecdir}
          EOF

          PKG_CONFIG_PATH="$PREFIX/share/pkgconfig" pkg-config --exists libclc
          test "$(PKG_CONFIG_PATH="$PREFIX/share/pkgconfig" pkg-config --variable=libexecdir libclc)" = "$PREFIX/libclc"
          echo "MESA_LIBCLC_PREFIX=$PREFIX" >> "$GITHUB_ENV"

      - name: Cache iOS sysroot
        id: cache-sysroot
        uses: actions/cache@v4
        with:
          path: sysroot-iOS-arm64
          key: ipados27-jit-ios-arm64-${{ hashFiles('scripts/build_dependencies.sh', 'patches/**') }}-libclc-22.1.8.3

      - name: Build iOS JIT sysroot
        if: steps.cache-sysroot.outputs.cache-hit != 'true'
        env:
          NCPU: 0
        run: ./scripts/build_dependencies.sh -p ios -a arm64

      - name: Validate sysroot
        shell: bash
        run: |
          set -euo pipefail
          test -d sysroot-iOS-arm64
          test -d sysroot-iOS-arm64/Frameworks
          test -x sysroot-iOS-arm64/host/bin/mesa_clc
          test -x sysroot-iOS-arm64/host/bin/vtn_bindgen2

      - name: Build UTM archive
        run: ./scripts/build_utm.sh -k iphoneos -s iOS -a arm64 -o UTM

      - name: Package unsigned JIT IPA
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/package.sh ipa UTM.xcarchive .
          mv UTM.ipa UTM-5.0.5-iPadOS27-JIT.ipa
          test -s UTM-5.0.5-iPadOS27-JIT.ipa

      - name: Verify IPA and JIT contract
        shell: bash
        run: |
          set -euo pipefail
          rm -rf verify
          mkdir verify
          unzip -q UTM-5.0.5-iPadOS27-JIT.ipa -d verify

          APP="$(find verify/Payload -maxdepth 1 -name '*.app' -type d | head -1)"
          test -n "$APP"
          EXECUTABLE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")
          echo "Bundle ID: $BUNDLE_ID"
          test -x "$APP/$EXECUTABLE"

          ldid -e "$APP/$EXECUTABLE" > entitlements.plist
          plutil -p entitlements.plist
          grep -q 'get-task-allow' entitlements.plist
          grep -q 'dynamic-codesigning' entitlements.plist

          grep -q 'brk #0x69' build-iOS-arm64/qemu-10.0.12-utm/tcg/region.c
          grep -q 'EXPECTED_BRK = 0x69' JIT/utm-ipados27.js

      - name: Create complete JIT kit
        shell: bash
        run: |
          set -euo pipefail
          rm -rf UTM-iPadOS27-JIT-Kit
          mkdir UTM-iPadOS27-JIT-Kit
          cp UTM-5.0.5-iPadOS27-JIT.ipa UTM-iPadOS27-JIT-Kit/
          cp JIT/utm-ipados27.js UTM-iPadOS27-JIT-Kit/
          cp JIT/README.md UTM-iPadOS27-JIT-Kit/
          ditto -c -k --sequesterRsrc --keepParent UTM-iPadOS27-JIT-Kit UTM-5.0.5-iPadOS27-JIT-Kit.zip

      - name: Upload complete kit
        uses: actions/upload-artifact@v4
        with:
          name: UTM-5.0.5-iPadOS27-JIT-Kit
          path: |
            UTM-5.0.5-iPadOS27-JIT.ipa
            UTM-5.0.5-iPadOS27-JIT-Kit.zip
            JIT/utm-ipados27.js
            JIT/README.md
          if-no-files-found: error
