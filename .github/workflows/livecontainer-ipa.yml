name: LiveContainer IPA
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Download latest upstream UTM IPA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download --repo utmapp/UTM --pattern 'UTM.ipa' --dir .
          test -s UTM.ipa
      - name: Patch for LiveContainer
        run: python3 scripts/livecontainer_ipa.py UTM.ipa UTM-LiveContainer.ipa
      - name: Verify IPA
        run: |
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile("UTM-LiveContainer.ipa") as z:
              assert z.testzip() is None
              assert any(n.startswith("Payload/") and n.endswith(".app/Info.plist") for n in z.namelist())
              assert not any("iOSHelper.appex/" in n or "iOSHelper-SE.appex/" in n for n in z.namelist())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: UTM-LiveContainer
          path: UTM-LiveContainer.ipa
          if-no-files-found: error
